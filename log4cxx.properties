# ==============================================================================
# Apache log4cxx Configuration for C++11 TCP Server
# ==============================================================================

# 设置根 Logger 级别以及附加的 Appender (DEBUG, INFO, WARN, ERROR, FATAL)
log4j.rootLogger=DEBUG, stdout, file

# ------------------------------------------------------------------------------
# 控制台输出配置 (ConsoleAppender)
# ------------------------------------------------------------------------------
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
# 日志格式: [时间戳] [线程ID] 级别 日志记录器 [源文件:行号] - 日志消息
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c [%F:%L] - %m%n

# ------------------------------------------------------------------------------
# 滚动文件输出配置 (RollingFileAppender)
# ------------------------------------------------------------------------------
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/tcp_server.log
log4j.appender.file.Append=true
# 单个文件最大大小 (例如 10MB)
log4j.appender.file.MaxFileSize=10MB
# 最多保留的历史备份文件个数
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c [%F:%L] - %m%n
